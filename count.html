<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字符统计工具</title>
    <style>
        /* 保持原样式不变 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        
        body {
            background-color: #f5f7f9;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #222;
            font-weight: 600;
        }
        
        .tool-container {
            background-color: white;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            padding: 20px;
        }
        
        #textInput {
            width: 100%;
            height: 200px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            line-height: 1.5;
            resize: none;
            spellcheck: false;
        }
        
        #textInput:focus {
            border-color: #4a86e8;
            outline: none;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .stat-item {
            background-color: #fff;
            border: 1px solid #eee;
            border-radius: 5px;
            padding: 15px;
            text-align: center;
            transition: background-color 0.3s ease;
        }
        
        .stat-item.chinese-card {
            background: linear-gradient(to bottom, #fff, #f9f0ff);
            cursor: pointer;
        }
        
        .stat-item.english-card {
            background: linear-gradient(to bottom, #fff, #f0f9ff);
            cursor: pointer;
        }
        
        .stat-label {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .stat-item:nth-child(1) .stat-value { color: #4a86e8; }
        .stat-item:nth-child(2) .stat-value { color: #e74c3c; }
        .stat-item:nth-child(3) .stat-value { color: #27ae60; }
        .stat-item:nth-child(4) .stat-value { color: #9b59b6; }
        
        .extract-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 25px;
            z-index: 1000;
            width: 90%;
            max-width: 400px;
            display: none;
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .panel-title {
            font-size: 1.3rem;
            color: #2c3e50;
            font-weight: 600;
        }
        
        .close-panel {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #7f8c8d;
            cursor: pointer;
        }
        
        .options-container {
            margin-bottom: 20px;
        }
        
        .option-group {
            margin-bottom: 15px;
        }
        
        .option-title {
            font-weight: 500;
            color: #555;
            margin-bottom: 10px;
        }
        
        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        
        .option-item input {
            width: 20px;
            height: 20px;
        }
        
        .option-item label {
            font-size: 1rem;
        }
        
        .panel-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .panel-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        
        .btn-confirm {
            background: #3498db;
            color: white;
        }
        
        .btn-cancel {
            background: #ecf0f1;
            color: #7f8c8d;
        }
        
        .btn-confirm:hover {
            background: #2980b9;
        }
        
        .btn-cancel:hover {
            background: #d5dbdb;
        }
        
        .extract-result {
            margin-top: 25px;
            display: none;
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .result-title {
            font-size: 1.2rem;
            color: #2c3e50;
            font-weight: 600;
        }
        
        #extractedContent {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1rem;
            line-height: 1.6;
            resize: none;
            margin-bottom: 15px;
            spellcheck: false;
        }
        
        .result-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        
        .action-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        
        .btn-copy {
            background: #2ecc71;
            color: white;
        }
        
        .btn-reset {
            background: #ecf0f1;
            color: #7f8c8d;
        }
        
        .btn-copy:hover {
            background: #27ae60;
        }
        
        .btn-reset:hover {
            background: #d5dbdb;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
        }

        /* 新增选中统计面板样式 */
        .selected-stats {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .selected-stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .selected-stats-title {
            font-size: 1.2rem;
            color: #2c3e50;
            font-weight: 600;
        }

        .selected-stats-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .selected-stat-item {
            background: linear-gradient(to bottom, #fff, #fff5f0);
            border: 1px solid #eee;
            border-radius: 5px;
            padding: 15px;
            text-align: center;
        }

        .selected-stat-label {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 5px;
        }

        .selected-stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e67e22;
        }
        
        @media (max-width: 700px) {
            .stats-container, .selected-stats-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 400px) {
            .stats-container, .selected-stats-container {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay"></div>
    
    <div class="container">
        <header>
            <h1>字符统计工具</h1>
        </header>
        
        <div class="tool-container">
            <textarea 
                id="textInput" 
                placeholder="在此输入或粘贴文本..."
                autofocus
            ></textarea>
            
            <div class="stats-container">
                <div class="stat-item">
                    <div class="stat-label">总字符数</div>
                    <div id="totalCharCount" class="stat-value">0</div>
                </div>
                
                <div class="stat-item chinese-card" id="chineseCard">
                    <div class="stat-label">中文字符</div>
                    <div id="chineseCount" class="stat-value">0</div>
                </div>
                
                <div class="stat-item english-card" id="englishCard">
                    <div class="stat-label">英文字符</div>
                    <div id="englishCount" class="stat-value">0</div>
                </div>
                
                <div class="stat-item">
                    <div class="stat-label">空格数</div>
                    <div id="spaceCount" class="stat-value">0</div>
                </div>
            </div>
            
            <!-- 新增选中统计区域 -->
            <div class="selected-stats" id="selectedStats">
                <div class="selected-stats-header">
                    <div class="selected-stats-title">选中文本统计</div>
                    <div id="selectionInfo">未选择任何文本</div>
                </div>
                
                <div class="selected-stats-container">
                    <div class="selected-stat-item">
                        <div class="selected-stat-label">总字符数</div>
                        <div id="selectedTotalCharCount" class="selected-stat-value">0</div>
                    </div>
                    
                    <div class="selected-stat-item">
                        <div class="selected-stat-label">中文字符</div>
                        <div id="selectedChineseCount" class="selected-stat-value">0</div>
                    </div>
                    
                    <div class="selected-stat-item">
                        <div class="selected-stat-label">英文字符</div>
                        <div id="selectedEnglishCount" class="selected-stat-value">0</div>
                    </div>
                    
                    <div class="selected-stat-item">
                        <div class="selected-stat-label">空格数</div>
                        <div id="selectedSpaceCount" class="selected-stat-value">0</div>
                    </div>
                </div>
            </div>
            
            <div class="extract-panel" id="extractPanel">
                <div class="panel-header">
                    <div class="panel-title">提取选项</div>
                    <button class="close-panel">&times;</button>
                </div>
                
                <div class="options-container">
                    <div class="option-group">
                        <div class="option-title">换行设置</div>
                        <div class="option-item">
                            <input type="checkbox" id="autoLinebreak" checked>
                            <label for="autoLinebreak">按原文换行</label>
                        </div>
                    </div>
                </div>
                
                <div class="panel-actions">
                    <button class="panel-btn btn-cancel">取消</button>
                    <button class="panel-btn btn-confirm">确定</button>
                </div>
            </div>
            
            <div class="extract-result" id="extractResult">
                <div class="result-header">
                    <div class="result-title">提取结果</div>
                </div>
                
                <textarea 
                    id="extractedContent" 
                    placeholder="提取的内容将显示在这里..."
                ></textarea>
                
                <div class="result-actions">
                    <button class="action-btn btn-reset" id="resetResult">重置</button>
                    <button class="action-btn btn-copy" id="copyResult">复制</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 获取DOM元素
        const textInput = document.getElementById('textInput');
        const totalCharCount = document.getElementById('totalCharCount');
        const chineseCount = document.getElementById('chineseCount');
        const englishCount = document.getElementById('englishCount');
        const spaceCount = document.getElementById('spaceCount');
        const chineseCard = document.getElementById('chineseCard');
        const englishCard = document.getElementById('englishCard');
        const extractPanel = document.getElementById('extractPanel');
        const extractResult = document.getElementById('extractResult');
        const extractedContent = document.getElementById('extractedContent');
        const overlay = document.getElementById('overlay');
        
        // 新增选中统计元素
        const selectedStats = document.getElementById('selectedStats');
        const selectionInfo = document.getElementById('selectionInfo');
        const selectedTotalCharCount = document.getElementById('selectedTotalCharCount');
        const selectedChineseCount = document.getElementById('selectedChineseCount');
        const selectedEnglishCount = document.getElementById('selectedEnglishCount');
        const selectedSpaceCount = document.getElementById('selectedSpaceCount');
        
        // 正则表达式
        const chineseRegex = /[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff]/g;
        const englishRegex = /[A-Za-z]/g;
        const spaceRegex = /\s/g;
        
        // 输入法状态跟踪
        let isComposing = false;
        let currentExtractType = '';
        
        // 通用统计函数
        function getStatistics(text) {
            const chineseMatches = text.match(chineseRegex) || [];
            const englishMatches = text.match(englishRegex) || [];
            const spaceMatches = text.match(spaceRegex) || [];
            
            return {
                total: text.length,
                chinese: chineseMatches.length,
                english: englishMatches.length,
                space: spaceMatches.length
            };
        }
        
        // 统计文本中的字符
        function countChars() {
            const text = textInput.value;
            const stats = getStatistics(text);
            
            totalCharCount.textContent = stats.total;
            chineseCount.textContent = stats.chinese;
            englishCount.textContent = stats.english;
            spaceCount.textContent = stats.space;
            
            // 更新选中统计（如果没有选中文本，则显示0）
            updateSelectedStats();
        }
        
        // 更新选中文本统计
        function updateSelectedStats() {
            const selectedText = getSelectedText();
            
            if (selectedText) {
                const stats = getStatistics(selectedText);
                
                selectedTotalCharCount.textContent = stats.total;
                selectedChineseCount.textContent = stats.chinese;
                selectedEnglishCount.textContent = stats.english;
                selectedSpaceCount.textContent = stats.space;
                
                // 更新选中信息
                selectionInfo.textContent = `已选择 ${stats.total} 个字符`;
                selectedStats.style.display = 'block';
            } else {
                // 没有选中文本时隐藏面板
                selectedStats.style.display = 'none';
                selectionInfo.textContent = '未选择任何文本';
            }
        }
        
        // 获取选中的文本
        function getSelectedText() {
            if (window.getSelection) {
                return window.getSelection().toString();
            } else if (document.selection) {
                return document.selection.createRange().text;
            }
            return '';
        }
        
        // 输入法状态变更处理
        textInput.addEventListener('compositionstart', () => {
            isComposing = true;
        });
        
        textInput.addEventListener('compositionend', () => {
            isComposing = false;
            countChars();
        });
        
        // 普通输入事件处理
        textInput.addEventListener('input', () => {
            if (!isComposing) {
                countChars();
            }
        });
        
        // 优化：使用selectionchange事件实时跟踪选择变化
        document.addEventListener('selectionchange', () => {
            // 检查选择是否在文本输入框内
            const activeElement = document.activeElement;
            if (activeElement === textInput) {
                updateSelectedStats();
            }
        });
        
        // 卡片点击事件处理
        chineseCard.addEventListener('click', () => {
            currentExtractType = 'chinese';
            showExtractPanel();
        });
        
        englishCard.addEventListener('click', () => {
            currentExtractType = 'english';
            showExtractPanel();
        });
        
        // 显示提取面板
        function showExtractPanel() {
            overlay.style.display = 'block';
            extractPanel.style.display = 'block';
        }
        
        // 关闭面板
        document.querySelector('.close-panel').addEventListener('click', closePanel);
        document.querySelector('.btn-cancel').addEventListener('click', closePanel);
        document.querySelector('.btn-confirm').addEventListener('click', extractContent);
        
        // 点击遮罩层关闭面板
        overlay.addEventListener('click', closePanel);
        
        // 关闭选项面板
        function closePanel() {
            overlay.style.display = 'none';
            extractPanel.style.display = 'none';
        }
        
        // 执行内容提取
        function extractContent() {
            const text = textInput.value;
            let result = '';
            const autoLinebreak = document.getElementById('autoLinebreak').checked;
            
            if (currentExtractType === 'chinese') {
                // 中文提取：保留换行结构
                result = extractChinese(text, autoLinebreak);
            } else if (currentExtractType === 'english') {
                result = extractEnglish(text, autoLinebreak);
            }
            
            // 显示结果
            extractedContent.value = result;
            extractResult.style.display = 'block';
            closePanel();
        }
        
        // 修复后的中文提取函数 - 保留换行结构
        function extractChinese(text, autoLinebreak) {
            let result = '';
            let currentLine = '';
            
            // 按行处理文本
            const lines = text.split('\n');
            
            for (const line of lines) {
                // 提取当前行的所有中文字符
                const chineseChars = line.match(chineseRegex) || [];
                
                if (chineseChars.length > 0) {
                    // 将中文字符连接成字符串
                    const chineseString = chineseChars.join('');
                    
                    if (autoLinebreak) {
                        // 保留换行结构
                        if (currentLine) {
                            result += currentLine + '\n';
                            currentLine = '';
                        }
                        result += chineseString + '\n';
                    } else {
                        // 不保留换行，直接添加到当前行
                        currentLine += chineseString;
                    }
                }
            }
            
            // 添加最后一行
            if (currentLine) {
                result += currentLine;
            }
            
            return result.trim();
        }
        
        // 英文提取函数（保留空格和换行）
        function extractEnglish(text, autoLinebreak) {
            let result = '';
            let currentLine = '';
            
            // 按行处理文本
            const lines = text.split('\n');
            
            for (const line of lines) {
                let inWord = false;
                let currentWord = '';
                
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    
                    if (char.match(/[A-Za-z]/)) {
                        currentWord += char;
                        inWord = true;
                    } else if (char.match(/\s/) && inWord) {
                        // 单词结束，添加到当前行
                        if (currentLine) currentLine += ' ';
                        currentLine += currentWord;
                        currentWord = '';
                        inWord = false;
                    }
                }
                
                // 处理行末的单词
                if (currentWord) {
                    if (currentLine) currentLine += ' ';
                    currentLine += currentWord;
                }
                
                // 添加到结果
                if (currentLine) {
                    if (autoLinebreak) {
                        result += currentLine + '\n';
                    } else {
                        if (result) result += ' ';
                        result += currentLine;
                    }
                    currentLine = '';
                }
            }
            
            return result.trim();
        }
        
        // 复制结果
        document.getElementById('copyResult').addEventListener('click', () => {
            extractedContent.select();
            document.execCommand('copy');
            alert('内容已复制到剪贴板！');
        });
        
        // 重置结果
        document.getElementById('resetResult').addEventListener('click', () => {
            extractResult.style.display = 'none';
            extractedContent.value = '';
        });
        
        // 初始化统计值
        countChars();
    </script>
</body>
</html>

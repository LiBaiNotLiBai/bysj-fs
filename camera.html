<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>摄像头传输</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .preview-container {
      width: 160px;
      height: 120px;
      border: 2px solid #333;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
      position: relative;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .status-overlay {
      position: absolute;
      top: 5px;
      left: 5px;
      right: 5px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin: 1px;
    }

    .dot-cam {
      background: #f00;
      box-shadow: 0 0 3px #f00;
    }

    .dot-cam.active {
      background: #0f0;
      box-shadow: 0 0 5px #0f0;
    }

    .dot-server {
      background: #f00;
      box-shadow: 0 0 3px #f00;
    }

    .dot-server.active {
      background: #0f0;
      box-shadow: 0 0 5px #0f0;
    }

    .dot-stream {
      background: #f00;
      box-shadow: 0 0 3px #f00;
    }

    .dot-stream.active {
      background: #0af;
      box-shadow: 0 0 5px #0af;
    }

    .status-text {
      position: absolute;
      bottom: -25px;
      left: 0;
      right: 0;
      color: #0f0;
      font-family: monospace;
      font-size: 11px;
      text-align: center;
      padding: 3px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 3px;
      border: 1px solid #333;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    .pulsing {
      animation: pulse 1s infinite;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="preview-container">
    <video id="video" autoplay playsinline muted></video>
    <div class="status-overlay">
      <div class="status-dot dot-cam" id="cam-dot"></div>
      <div class="status-dot dot-server" id="server-dot"></div>
      <div class="status-dot dot-stream" id="stream-dot"></div>
    </div>
    <div class="status-text" id="status-text">正在启动...</div>
  </div>

  <script>
    // 配置文件
    const config = {
      serverUrl: 'ws://192.168.226.116:8765',
      quality: 0.7,
      targetFPS: 15,
      width: 320,
      height: 240,
      debugLogInterval: 30  // 每30帧输出一次调试信息
    };

    // 应用程序状态
    const state = {
      ws: null,
      stream: null,
      canvas: null,
      ctx: null,
      isStreaming: false,
      cameraReady: false,
      serverConnected: false,
      frameCounter: 0,
      fps: 0,
      lastFrameTime: 0,
      framesSent: 0,
      isBackCamera: true,
      reconnectAttempts: 0,
      maxReconnectAttempts: 10,
      debugFrameCount: 0
    };

    // DOM元素引用
    const video = document.getElementById('video');
    const camDot = document.getElementById('cam-dot');
    const serverDot = document.getElementById('server-dot');
    const streamDot = document.getElementById('stream-dot');
    const statusText = document.getElementById('status-text');

    // 更新状态指示灯
    function updateDot(dot, active) {
      dot.classList.toggle('active', active);
      dot.classList.toggle('pulsing', !active);
    }

    // 更新状态文本
    function updateStatus(text) {
      statusText.textContent = text;
    }

    // 发送状态信息到服务器
    function sendStatusToServer(statusType, status) {
      if (state.ws && state.ws.readyState === WebSocket.OPEN) {
        state.ws.send(JSON.stringify({
          type: 'camera_status',
          status_type: statusType,
          status: status,
          timestamp: Date.now()
        }));
      }
    }

    // 初始化摄像头
    async function initCamera() {
      try {
        updateStatus('启动摄像头...');
        updateDot(camDot, false);

        const constraints = {
          video: {
            width: { ideal: 640 },
            height: { ideal: 480 },
            frameRate: { ideal: 30 },
            facingMode: state.isBackCamera ? 'environment' : 'user'
          }
        };

        state.stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = state.stream;
        state.cameraReady = true;
        updateDot(camDot, true);
        updateStatus('摄像头就绪');
        sendStatusToServer('camera', 'ready');

        // 创建用于捕获视频帧的画布
        if (!state.canvas) {
          state.canvas = document.createElement('canvas');
          state.canvas.width = config.width;
          state.canvas.height = config.height;
          state.ctx = state.canvas.getContext('2d');
        }

        // 连接WebSocket服务器
        setTimeout(connectWebSocket, 1000);

      } catch (err) {
        updateDot(camDot, false);
        updateStatus('摄像头错误');
        sendStatusToServer('camera', 'error');

        // 尝试切换摄像头
        if (state.isBackCamera) {
          state.isBackCamera = false;
          setTimeout(initCamera, 2000);
        }
      }
    }

    // 连接WebSocket服务器
    function connectWebSocket() {
      if (state.serverConnected || !state.cameraReady) return;

      updateStatus('连接服务器...');
      updateDot(serverDot, false);

      try {
        state.ws = new WebSocket(config.serverUrl);

        const timeout = setTimeout(() => {
          if (state.ws?.readyState !== WebSocket.OPEN) {
            state.ws?.close();
            handleConnectionError();
          }
        }, 10000);

        state.ws.onopen = () => {
          clearTimeout(timeout);
          state.serverConnected = true;
          updateDot(serverDot, true);
          updateStatus('服务器已连接，等待指令');
          sendStatusToServer('server', 'connected');

          // 注册为摄像头客户端
          state.ws.send(JSON.stringify({
            type: 'register',
            clientType: 'camera',
            resolution: `${config.width}x${config.height}`
          }));
        };

        state.ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);

            if (data.type === 'control') {
              handleControlCommand(data);
            } else if (data.type === 'pong') {
              // 心跳响应
            }
          } catch (e) {
            // 忽略解析错误
          }
        };

        state.ws.onclose = () => {
          state.serverConnected = false;
          state.isStreaming = false;
          updateDot(serverDot, false);
          updateDot(streamDot, false);
          updateStatus('服务器断开');
          sendStatusToServer('server', 'disconnected');

          // 尝试重新连接
          if (state.reconnectAttempts < state.maxReconnectAttempts) {
            state.reconnectAttempts++;
            setTimeout(connectWebSocket, 2000 * state.reconnectAttempts);
          }
        };

        state.ws.onerror = () => {
          handleConnectionError();
        };

      } catch (err) {
        handleConnectionError();
      }
    }

    // 处理连接错误
    function handleConnectionError() {
      updateDot(serverDot, false);
      updateStatus('连接失败');
      sendStatusToServer('server', 'error');

      // 尝试重新连接
      if (state.reconnectAttempts < state.maxReconnectAttempts) {
        state.reconnectAttempts++;
        setTimeout(connectWebSocket, 2000 * state.reconnectAttempts);
      }
    }

    // 处理控制命令
    function handleControlCommand(data) {
      const command = data.command;
      const value = data.value;

      if (command === 'start_stream') {
        startStreaming();
      } else if (command === 'stop_stream') {
        stopStreaming();
      } else if (command === 'switch_camera') {
        switchCamera();
      } else if (command === 'close_camera') {
        closeCamera();
      }
    }

    // 开始视频流传输
    function startStreaming() {
      if (!state.cameraReady || !state.serverConnected) {
        console.warn('无法开始传输: 摄像头或服务器未就绪');
        return;
      }

      state.isStreaming = true;
      state.frameCounter = 0;
      state.lastFrameTime = Date.now();
      state.debugFrameCount = 0;
      updateDot(streamDot, true);
      updateStatus('传输中');
      sendStatusToServer('stream', 'started');

      function transmitFrame() {
        if (!state.isStreaming || state.ws?.readyState !== WebSocket.OPEN) {
          return;
        }

        const now = Date.now();
        state.frameCounter++;
        state.debugFrameCount++;

        // 计算FPS
        if (now - state.lastFrameTime >= 1000) {
          state.fps = state.frameCounter;
          state.frameCounter = 0;
          state.lastFrameTime = now;
        }

        // 捕获并处理视频帧
        if (video.readyState >= video.HAVE_ENOUGH_DATA) {
          state.ctx.clearRect(0, 0, config.width, config.height);

          // 镜像处理以匹配预览效果
          state.ctx.save();
          state.ctx.scale(-1, 1);
          state.ctx.translate(-config.width, 0);
          state.ctx.drawImage(video, 0, 0, config.width, config.height);
          state.ctx.restore();
        }

        // 编码并发送视频帧
        state.canvas.toBlob(blob => {
          if (!blob || state.ws?.readyState !== WebSocket.OPEN) return;

          const reader = new FileReader();
          reader.onload = () => {
            const bytes = new Uint8Array(reader.result);
            let binaryString = '';

            for (let i = 0; i < bytes.length; i++) {
              binaryString += String.fromCharCode(bytes[i]);
            }

            const base64Data = btoa(binaryString);

            // 限速调试输出
            if (state.debugFrameCount % config.debugLogInterval === 0) {
              console.log(`发送第${state.framesSent + 1}帧，大小: ${blob.size}字节`);
            }

            // 发送视频帧数据
            state.ws.send(JSON.stringify({
              type: 'video_frame',
              data: base64Data,
              width: config.width,
              height: config.height,
              quality: config.quality,
              timestamp: now
            }));

            state.framesSent++;
          };

          reader.readAsArrayBuffer(blob);
        }, 'image/jpeg', config.quality);

        // 安排下一帧传输
        if (state.isStreaming) {
          setTimeout(transmitFrame, 1000 / config.targetFPS);
        }
      }

      transmitFrame();
    }

    // 停止视频流传输
    function stopStreaming() {
      state.isStreaming = false;
      updateDot(streamDot, false);
      updateStatus('传输停止');
      sendStatusToServer('stream', 'stopped');
      console.log('视频传输已停止');
    }

    // 切换摄像头
    async function switchCamera() {
      if (state.stream) {
        state.stream.getTracks().forEach(track => track.stop());
      }

      state.isBackCamera = !state.isBackCamera;
      updateStatus('切换摄像头...');
      updateDot(camDot, false);
      sendStatusToServer('camera', 'switching');

      await initCamera();
    }

    // 关闭摄像头
    function closeCamera() {
      console.log('关闭摄像头');

      // 停止视频流传输
      if (state.isStreaming) {
        stopStreaming();
      }

      // 关闭摄像头轨道
      if (state.stream) {
        state.stream.getTracks().forEach(track => track.stop());
        state.stream = null;
      }

      // 更新状态
      state.cameraReady = false;
      updateDot(camDot, false);
      updateStatus('摄像头已关闭');
      video.srcObject = null;

      sendStatusToServer('camera', 'closed');
    }

    // 页面加载时初始化
    window.addEventListener('load', () => {
      initCamera();
    });

    // 页面关闭时清理资源
    window.addEventListener('beforeunload', () => {
      if (state.stream) {
        state.stream.getTracks().forEach(track => track.stop());
      }
      if (state.ws) {
        state.ws.close();
      }
    });

    // 保持屏幕唤醒
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(() => { });
    }
  </script>
</body>

</html>
